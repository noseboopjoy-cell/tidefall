<title>Tidefall</title>
<style>
  html,body{margin:0;padding:0;background:#0b0817;height:100%;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    width:auto;height:auto;max-width:100vw;max-height:100vh;aspect-ratio:16/9}

<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<script>

// engine.js - canvas, loop, input, audio, save, scenes, fx
"use strict";
const VW=480, VH=270, TS=16;
const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
function fitCanvas(){
  const w=innerWidth,h=innerHeight,s=Math.max(1,Math.min(w/VW,h/VH));
  canvas.style.width=(VW*s)+"px";canvas.style.height=(VH*s)+"px";
}
addEventListener("resize",fitCanvas);fitCanvas();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
let seed=1234;
function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
const rint=n=>Math.floor(rnd()*n);
const pick=a=>a[rint(a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

// fixed timestep loop
const STEP=1/60;let acc=0,last=performance.now();
function frame(now){acc+=Math.min(.25,(now-last)/1000);last=now;
  while(acc>=STEP){Scenes.update(STEP);acc-=STEP;}
  ctx.setTransform(1,0,0,1,0,0);Scenes.render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// input: keyboard, touch, gamepad
const Input={keys:{},axes:{x:0,y:0},btn:{a:false,b:false,menu:false},press:{a:false,b:false,menu:false},
  mobile:false,stick:null,pts:{},
  init(){
    addEventListener("keydown",e=>{const k=e.key.toLowerCase();this.keys[k]=true;
      if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
      Audio.unlock();if((k==="enter"||k==="escape")&&!e.repeat)this.press.menu=true;});
    addEventListener("keyup",e=>{this.keys[e.key.toLowerCase()]=false;});
    this.mobile=("ontouchstart" in window)||(navigator.maxTouchPoints||0)>0||/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent||"");
    try{if(/[?&]touch/.test(window.location.search))this.mobile=true;}catch(e){}
    canvas.addEventListener("pointerdown",e=>{Audio.unlock();this.pDown(e);},{passive:false});
    canvas.addEventListener("pointermove",e=>{this.pMove(e);},{passive:false});
    addEventListener("pointerup",e=>this.pUp(e));
    addEventListener("pointercancel",e=>this.pUp(e));
    addEventListener("blur",()=>{this.keys={};this.axes={x:0,y:0};this.pts={};this.stick=null;this.btn={a:false,b:false,menu:false};});
  },
  zone(x,y){
    if(x>VW-64&&y>VH-64)return "a";
    if(x>VW-64&&y>VH-118&&y<=VH-64)return "b";
    if(x>VW-36&&y<34)return "menu";
    if(x<VW*0.55)return "stick";
    return null;},
  pDown(e){e.preventDefault();const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;
    const z=this.zone(x,y);if(!z)return;this.pts[e.pointerId]=z;
    if(z==="stick")this.stick={x,y};
    else if(z==="a")this.btn.a=true;else if(z==="b")this.btn.b=true;else if(z==="menu")this.btn.menu=true;},
  pMove(e){if(this.pts[e.pointerId]!=="stick")return;const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;
    const dx=x-this.stick.x,dy=y-this.stick.y,d=Math.hypot(dx,dy);
    if(d>4){const m=Math.min(1,d/24);this.axes={x:dx/d*m,y:dy/d*m};}else this.axes={x:0,y:0};},
  pUp(e){const z=this.pts[e.pointerId];delete this.pts[e.pointerId];if(!z)return;
    if(z==="stick"){this.stick=null;this.axes={x:0,y:0};}
    else if(z==="a")this.btn.a=false;else if(z==="b")this.btn.b=false;else if(z==="menu")this.btn.menu=false;},
  poll(){
    if(!this.stick){
      let x=0,y=0;
      if(this.keys["arrowleft"]||this.keys["a"])x--;if(this.keys["arrowright"]||this.keys["d"])x++;
      if(this.keys["arrowup"]||this.keys["w"])y--;if(this.keys["arrowdown"]||this.keys["s"])y++;
      const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}this.axes={x,y};
    }
    if(navigator.getGamepads){const gp=navigator.getGamepads()[0];
      if(gp){const gx=gp.axes[0]||0,gy=gp.axes[1]||0;if(Math.hypot(gx,gy)>.25){this.axes={x:gx,y:gy};}
        if(gp.buttons[0]&&gp.buttons[0].pressed)this.btn.a=true;
        if(gp.buttons[1]&&gp.buttons[1].pressed)this.btn.b=true;
        if(gp.buttons[9]&&gp.buttons[9].pressed)this.btn.menu=true;}}
    if(this.keys["z"]||this.keys["j"])this.btn.a=true;
    if(this.keys["x"]||this.keys["k"])this.btn.b=true;
  },
  consume(){const p={...this.press};for(const k in this.press)this.press[k]=false;
    const b={a:this.btn.a,b:this.btn.b,menu:this.btn.menu};
    this.btn.a=false;this.btn.b=false;this.btn.menu=false;
    for(const k in b)if(b[k])p[k]=true;return p;}
};
Input.init();

// audio: synth sfx + pattern sequencer
const NOTE=m=>m>0?440*Math.pow(2,(m-69)/12):0;
const Audio={ctx:null,master:null,mus:null,sfxG:null,unlocked:false,track:null,step:0,nextT:0,
  unlock(){if(this.unlocked)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=.6;this.master.connect(this.ctx.destination);
    this.mus=this.ctx.createGain();this.mus.gain.value=.5;this.mus.connect(this.master);
    this.sfxG=this.ctx.createGain();this.sfxG.gain.value=.7;this.sfxG.connect(this.master);
    this.unlocked=true;},
  tone(f,t,d,type,v,dest,slide){const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g);g.connect(dest||this.sfxG);o.start(t);o.stop(t+d+.02);},
  noise(t,d,v,dest){const n=this.ctx.createBufferSource(),b=this.ctx.createBuffer(1,2048,this.ctx.sampleRate),
    dt=b.getChannelData(0);for(let i=0;i<2048;i++)dt[i]=Math.random()*2-1;n.buffer=b;
    const f=this.ctx.createBiquadFilter();f.type="highpass";f.frequency.value=3000;
    const g=this.ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    n.connect(f);f.connect(g);g.connect(dest||this.sfxG);n.start(t);n.stop(t+d);},
  sfx(n){if(!this.unlocked)return;const t=this.ctx.currentTime;
    switch(n){
      case "menu":this.tone(620,t,.05,"square",.1);break;
      case "confirm":this.tone(660,t,.05,"square",.12);this.tone(990,t+.05,.08,"square",.12);break;
      case "cancel":this.tone(300,t,.08,"square",.1);break;
      case "hit":this.noise(t,.06,.2);this.tone(180,t,.06,"sawtooth",.15,null,.6);break;
      case "crit":this.tone(880,t,.1,"square",.15,null,1.6);this.noise(t,.08,.25);break;
      case "hurt":this.tone(140,t,.2,"sawtooth",.25,null,.7);break;
      case "swing":this.noise(t,.05,.08);break;
      case "potion":this.tone(500,t,.1,"triangle",.15,null,1.8);break;
      case "brew":this.tone(330,t,.15,"triangle",.15,null,1.4);this.tone(495,t+.12,.15,"triangle",.12);break;
      case "coin":this.tone(1050,t,.06,"square",.12);this.tone(1400,t+.06,.1,"square",.12);break;
      case "level":this.tone(523,t,.1,"square",.15);this.tone(659,t+.1,.1,"square",.15);this.tone(784,t+.2,.2,"square",.15);break;
      case "boss":this.tone(110,t,.4,"sawtooth",.3,null,.8);this.noise(t,.3,.2);break;
      case "die":this.tone(220,t,.5,"sawtooth",.2,null,.3);break;
      case "door":this.tone(440,t,.12,"triangle",.12);break;
    }},
  play(name){this.unlock();this.track=TRACKS[name]||null;this.step=0;this.nextT=this.ctx?this.ctx.currentTime+.05:0;},
  stop(){this.track=null;},
  tick(){if(!this.unlocked||!this.track)return;const tr=this.track,spb=15/tr.bpm;
    while(this.nextT<this.ctx.currentTime+.15){
      const s=this.step,t=this.nextT;
      const L=tr.lead[s%tr.lead.length];if(L)this.tone(NOTE(L+tr.key),t,spb*tr.pw||spb*.85,tr.wave||"square",.09,this.mus);
      const B=tr.bass[s%tr.bass.length];if(B)this.tone(NOTE(B+tr.key-12),t,spb*.9,"triangle",.14,this.mus);
      if(tr.drum){if(s%4===0)this.noise(t,.09,.14,this.mus);if(s%4===2)this.noise(t,.05,.05,this.mus);}
      this.step++;this.nextT+=spb;}}
};

         bass:[48,0,0,0,52,0,0,0,45,0,0,0,50,0,0,0,43,0,0,0,47,0,0,0,48,0,0,0,48,0,0,0]}

// persistence
const Save={KEY:"tidefall_save_v1",
  fresh(){return {v:1,level:1,xp:0,gold:30,chapter:1,map:"village",px:200,py:150,dir:"down",
    hp:30,maxhp:30,weapon:"sword1",armor:null,cloak:null,ring:null,
    inv:{potion_heal:2,potion_majheal:0,potion_vigour:0,potion_stone:0,potion_swift:0,potion_anti:0,potion_fire:0,potion_frost:0,potion_shock:0,potion_venom:0,potion_cleanse:0,potion_tide:0},
    mats:{herb:2,salt:0,fang:0,bloom:0,crystal:0,pearl:0,ash:0},
    recipes:["heal"],quests:{},flags:{},kills:0,playtime:0,bossRush:false,ngplus:0};},
  data:null,
  load(){if(!this.data)this.data=this.fresh();
    try{const r=localStorage.getItem(this.KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1)this.data=d;}}catch(e){}
    return this.data;},
  write(){if(!this.data)return;try{localStorage.setItem(this.KEY,JSON.stringify(this.data));}catch(e){}},
  wipe(){try{localStorage.removeItem(this.KEY);}catch(e){}this.data=this.fresh();}
};
setInterval(()=>Save.write(),30000);

// scenes
const Scenes={stack:[],
  push(s){this.stack.push(s);if(s.enter)s.enter();},
  pop(){const s=this.stack.pop();if(s.exit)s.exit();},
  switchTo(s){while(this.stack.length)this.pop();this.push(s);},
  update(dt){Audio.tick();Input.poll();const t=this.stack[this.stack.length-1];if(t&&t.update)t.update(dt);},
  render(){const t=this.stack[this.stack.length-1];if(t&&t.render)t.render();else{ctx.fillStyle="#0b0817";ctx.fillRect(0,0,VW,VH);}}};

// fx: particles, floating text, shake, fade
const FX={parts:[],texts:[],shake:0,fade:1,fadeDir:-1,fadeCb:null,
  burst(x,y,color,n=8,spd=60){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.4+Math.random()*.8);
    this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.4,color,r:1+Math.random()*2});}},
  text(x,y,msg,color="#fff"){this.texts.push({x,y,msg,color,life:1});},
  doShake(n){this.shake=Math.max(this.shake,n);},
  fadeTo(cb){this.fadeDir=1;this.fadeCb=cb;},
  update(dt){
    for(let i=this.parts.length-1;i>=0;i--){const p=this.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.life-=dt;if(p.life<=0)this.parts.splice(i,1);}
    for(let i=this.texts.length-1;i>=0;i--){const t=this.texts[i];t.y-=18*dt;t.life-=dt*1.2;if(t.life<=0)this.texts.splice(i,1);}
    if(this.shake>0)this.shake-=dt*30;
    if(this.fadeDir>0){this.fade+=dt*3;if(this.fade>=1){this.fade=1;this.fadeDir=0;if(this.fadeCb){const cb=this.fadeCb;this.fadeCb=null;cb();}}}
    else if(this.fadeDir<0){this.fade-=dt*3;if(this.fade<=0){this.fade=0;this.fadeDir=0;}}
  },
  render(){
    for(const p of this.parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x|0,p.y|0,p.r,p.r);}
    ctx.globalAlpha=1;ctx.textAlign="center";ctx.font="bold 8px monospace";
    for(const t of this.texts){ctx.globalAlpha=Math.max(0,Math.min(1,t.life*2));ctx.fillStyle="#000";ctx.fillText(t.msg,t.x+1,t.y+1);ctx.fillStyle=t.color;ctx.fillText(t.msg,t.x,t.y);}
    ctx.globalAlpha=1;
    if(this.shake>0)ctx.translate(rint(5)-2,rint(5)-2);
  },
  renderFade(){if(this.fade>0){ctx.fillStyle="rgba(6,4,12,"+this.fade+")";ctx.fillRect(-8,-8,VW+16,VH+16);}}
};

// art.js - procedural 32-bit-style sprites, all drawn in code
"use strict";
function mk(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.imageSmoothingEnabled=false;fn(g);return c;}
function P(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function shade(c,f){const n=parseInt(c.slice(1),16);let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  r=clamp(r*f|0,0,255);gg=clamp(gg*f|0,0,255);b=clamp(b*f|0,0,255);
  return "#"+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1);}
function heroBody(g,dir,fr,pal){
  const bob=(fr===1||fr===3)?-1:0;
  const legL=fr===1?-1:fr===3?1:0;
  const W=16,H=18;
  const cx=8;
  // legs + boots
  P(g,cx-3,14,2,4+legL,pal.pants);P(g,cx+1,14,2,4-legL,pal.pants);
  P(g,cx-3,16+legL,3,2,pal.boot);P(g,cx+1,16-legL,3,2,pal.boot);
  // coat body
  P(g,cx-4,6+bob,8,9,pal.coat);
  P(g,cx-4,12+bob,8,4,pal.coat2);
  P(g,cx-4,6+bob,8,1,pal.trim);
  // satchel strap
  if(dir!=="up"){P(g,cx-4,7+bob,9,1,pal.strap);}
  // satchel
  P(g,cx+(dir==="side"?-5:3),10+bob,3,3,pal.strap);
  // arms
  P(g,cx-5,8+bob,1,4,pal.coat2);P(g,cx+4,8+bob,1,4,pal.coat2);
  // head/hood
  P(g,cx-3,1+bob,6,6,pal.hood);
  P(g,cx-2,2+bob,4,4,dir==="up"?pal.hood:pal.skin);
  if(dir==="down"){P(g,cx-2,3+bob,1,1,"#20181f");P(g,cx+1,3+bob,1,1,"#20181f");
    P(g,cx-2,6+bob,4,1,pal.skin);}
  if(dir==="side"){P(g,cx+1,3+bob,1,1,"#20181f");P(g,cx+1,6+bob,2,1,pal.skin);}
  // hood rim + top
  P(g,cx-3,1+bob,6,1,pal.trim);P(g,cx-3,0+bob,6,1,pal.hood);
  // flask on belt
  P(g,cx+(dir==="side"?2:-1),11+bob,2,3,pal.flask);
  P(g,cx+(dir==="side"?2:-1),10+bob,2,1,pal.trim);
}
const HERO_PAL={coat:"#2a7f8f",coat2:"#20707f",trim:"#f2c14e",pants:"#31435e",boot:"#6e4a2f",
  skin:"#e8b88a",hood:"#2a7f8f",strap:"#5c4127",flask:"#d97b4a"};
function heroFrames(){
  const out={};
  for(const dir of["down","up","side"]){
    out[dir]=[0,1,2,3].map(fr=>mk(16,18,g=>heroBody(g,dir,fr,HERO_PAL)));
  }
  out.attack=mk(16,18,g=>{heroBody(g,"side",0,HERO_PAL);});
  return out;
}
// salamander companion
function salFrames(){
  return [0,1,2,3].map(fr=>mk(14,10,g=>{
    const bob=fr%2?-1:0;const tail=fr%4<2?1:0;
    P(g,3,2+bob,7,5,"#e07b2f");P(g,2,3+bob,2,3,"#e07b2f");
    P(g,10,1+bob-tail,3,1,"#c9641f");P(g,11,2+bob,2,1,"#c9641f");
    P(g,9,0+bob-tail,1,3,"#c9641f");
    P(g,2,3+bob,1,1,"#20181f");P(g,4,3+bob,1,1,"#20181f");
    P(g,3,5+bob,1,2,"#ff9a4d");P(g,6,6+bob,1,1,"#ff9a4d");
    P(g,4,6+bob,4,1,"#ffb066");
    P(g,5,3+bob,1,1,"#ffd166");
  }));
}
// generic enemy drawing via key
const ENEMY_ART={
  wisp:(g,p)=>{ // jellyfish
    P(g,4,2,8,5,p.a);P(g,5,1,6,1,p.b);P(g,5,7,6,1,p.b);
    P(g,6,3,4,3,p.c);
    for(let i=0;i<5;i++){P(g,4+i*2,8,1,3+((i+1)%2)*2,p.b);}
    P(g,7,3,2,2,p.c);
  },
  slime:(g,p)=>{P(g,3,6,10,6,p.a);P(g,4,4,8,3,p.a);P(g,5,3,6,1,p.b);

let WORLD={grid:null,map:null,objects:[],npcs:[],enemies:[],cam:{x:0,y:0}};
function buildMap(key){
  const def=MAPS[key];
  const g=[];for(let y=0;y<MH;y++){const row=[];for(let x=0;x<MW;x++)row.push(def.base);g.push(row);}
  const fill=(t,x,y,w,h)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)
    if(xx>=0&&yy>=0&&xx<MW&&yy<MH)g[yy][xx]=t;};
  for(const r of def.rects)fill(r.t,r.x,r.y,r.w,r.h);
  // border
  for(let x=0;x<MW;x++){g[0][x]=def.border;g[MH-1][x]=def.border;}
  for(let y=0;y<MH;y++){g[y][0]=def.border;g[y][MW-1]=def.border;}
  const sp=def.sprinkle||[];
  for(let i=0;i<sp.length;i++){const t=sp[i][0],n=sp[i][1];
    for(let k=0;k<n;k++){const x=1+rint(MW-2),y=1+rint(MH-2);
      if(g[y][x]===def.base&&(x<3||x>MW-4||y<3||y>MH-4||t==="f"))g[y][x]=t;}}
  WORLD.grid=g;WORLD.map=key;
  WORLD.objects=def.objects.map(o=>{const c={...o,used:false};c.house=c.o==="house";c.shopstall=c.o==="shopstall";c.bench=c.o==="bench";return c;});
  for(const o of WORLD.objects){
    if(o.solid&&o.house){for(let yy=o.y;yy<o.y+2;yy++)for(let xx=o.x;xx<o.x+2;xx++)g[yy][xx]="r";}
    else if(o.solid&&(o.save||o.shopstall||o.bench))g[o.y][o.x]="r";}
  WORLD.npcs=(def.npcs||[]).map(id=>{const n=NPCS.find(n=>n.id===id);
    return {...n,x:8+rint(28)*TS,y:8+rint(16)*TS};});
  // fix npc positions to walkable tiles
  for(const n of WORLD.npcs){let t=tileAt(n.x/TS|0,n.y/TS|0);let tries=0;
    while(SOLID.has(t)&&tries++<40){n.x=(8+rint(28))*TS;n.y=(8+rint(16))*TS;t=tileAt(n.x/TS|0,n.y/TS|0);}}
  WORLD.enemies=[];spawnEnemies();
}
function tileAt(tx,ty){if(tx<0||ty<0||tx>=MW||ty>=MH)return "W";return WORLD.grid[ty][tx];}
function solidAt(px,py){const t=tileAt(px/TS|0,py/TS|0);return SOLID.has(t);}
function boxSolid(x,y,w,h){return solidAt(x,y)||solidAt(x+w,y)||solidAt(x,y+h)||solidAt(x+w,y+h)
  ||solidAt(x+w/2,y)||solidAt(x+w/2,y+h);}
function spawnEnemies(){
  const def=MAPS[WORLD.map];if(!def.spawns)return;
  const ch=Game?Game.data.chapter:1;
  for(const s of def.spawns){for(let i=0;i<s.n;i++){
    const k=pick(s.types);const x=(s.x+rint(s.w))*TS,y=(s.y+rint(s.h))*TS;
    if(!solidAt(x,y))WORLD.enemies.push(makeEnemy(k,x,y));}}
}
function makeEnemy(key,x,y){
  const d=ENEMIES[key];const scale=1+(Game.data.chapter-1)*0.35+(Game.data.ngplus||0)*.5;
  let art=key;const tint=MAP_TINT[WORLD.map];if(tint&&tint[key])art=tint[key];
  return {key,art,x,y,w:12,h:12,hp:d.hp*scale,maxhp:d.hp*scale,dmg:d.dmg*(1+(Game.data.chapter-1)*.2),
    spd:d.spd,xp:d.xp,ai:d.ai,drop:d.drop,t:0,st:"idle",cd:0,flash:0,slow:0,poison:0,burn:0,hurtT:0};
}
function camera(){
  const tx=clamp(Game.player.x-VW/2,0,MW*TS-VW),ty=clamp(Game.player.y-VH/2,0,MH*TS-VH);
  WORLD.cam.x=lerp(WORLD.cam.x,tx,.12);WORLD.cam.y=lerp(WORLD.cam.y,ty,.12);
}

// game.js - gameplay state and logic
"use strict";
const Game={data:null,player:null,proj:[],drops:[],boss:null,bossDef:null,
  buffs:{atk:0,def:0,spd:0,anti:0},time:0,dialog:null,interact:null,msg:null,msgT:0,chapterCard:0,ending:null,
  start(fresh){
    this.data=Save.load();
    if(this.data.weapons===undefined){this.data.weapons={sword1:true};}
    buildArt();
    this.player={x:this.data.px,y:this.data.py,w:10,h:8,dir:this.data.dir||"down",
      hp:this.data.hp,anim:0,atkT:0,rollT:0,rollD:{x:0,y:0},inv:.5,dead:false,potT:0,swing:0};
    this.proj=[];this.drops=[];this.boss=null;this.dialog=null;this.msg=null;
    this.recalc();buildMap(this.data.map);
    this.player.x=this.data.px;this.player.y=this.data.py;
    this.syncQuests();
    if(fresh!==false)this.showChapter();
  },
  recalc(){
    const d=this.data;
    const a=ARMORS.find(x=>x.id===d.armor),c=CLOAKS.find(x=>x.id===d.cloak),r=RINGS.find(x=>x.id===d.ring);
    this.atk=(6+d.level*2+(WEAPONS[d.weapon]?WEAPONS[d.weapon].dmg:0))+(r&&r.atk||0);
    this.def=(a?a.def:0)+(c&&c.def||0);
    this.spd=62+(c?c.spd:0);
    this.crit=r&&r.crit||0;
    const hpMax=30+d.level*6+(r&&r.hp||0);
    if(hpMax!==d.maxhp){const ratio=d.hp/d.maxhp;d.maxhp=hpMax;d.hp=Math.round(hpMax*ratio);}
    this.hpMax=d.maxhp;
  },
  showChapter(){const c=CHAPTERS.find(c=>c.ch===this.data.chapter);
    if(c){this.chapterCard=3;Audio.play(c.track);}},
  syncQuests(){const q=this.data.quests;this.activeQuests=Object.keys(QUESTS).filter(k=>q[k]===1||q[k]===2);},
  save(){const p=this.player;this.data.px=p.x;this.data.py=p.y;this.data.dir=p.dir;
    this.data.hp=Math.min(p.hp,this.data.maxhp);Save.write();},
  addXp(n){const d=this.data;d.xp+=n;const need=this.xpNeed();
    if(d.xp>=need){d.xp-=need;d.level++;this.recalc();this.player.hp=this.hpMax;
      Audio.sfx("level");FX.text(this.player.x,this.player.y-14,"LEVEL UP!","#f2c14e");
      FX.burst(this.player.x,this.player.y,"#f2c14e",14,80);}},
  xpNeed(){return 20+this.data.level*18;},
  addItem(k,n){n=n||1;if(POTIONS[k])this.data.inv[k]=(this.data.inv[k]||0)+n;
    else if(MAT_NAMES[k])this.data.mats[k]=(this.data.mats[k]||0)+n;},
  hurt(n){const p=this.player;if(p.inv>0||p.dead)return;
    let dmg=n-this.def;if(dmg<1)dmg=1;if(this.buffs.def>0)dmg=Math.ceil(dmg/2);
    p.hp-=dmg;p.inv=.8;Audio.sfx("hurt");FX.doShake(4);
    FX.text(p.x,p.y-12,"-"+dmg,"#ff6b6b");
    if(p.hp<=0){p.hp=0;p.dead=true;Audio.sfx("die");}},
  update(dt){
    this.time+=dt;this.data.playtime+=dt;
    for(const k in this.buffs)if(this.buffs[k]>0)this.buffs[k]-=dt;
    const p=this.player;
    if(p.inv>0)p.inv-=dt;if(p.atkT>0)p.atkT-=dt;if(p.rollT>0)p.rollT-=dt;
    if(p.potT>0)p.potT-=dt;if(p.swing>0)p.swing-=dt;
    if(p.dead)return;
    const b=Input.consume();
    if(b.menu&&!this.dialog){UI.togglePause();return;}
    if(this.dialog){this.updateDialog(b);return;}
    if(UI.mode){UI.update(b);return;}
    let mx=Input.axes.x,my=Input.axes.y;
    const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;}
    let spd=this.spd*(this.buffs.spd>0?1.4:1);
    if(p.rollT>0){mx=p.rollD.x;my=p.rollD.y;spd=this.spd*2.1;}
    if(l>.1&&p.rollT<=0){
      if(Math.abs(mx)>Math.abs(my))p.dir=mx>0?"sideR":"sideL";else p.dir=my>0?"down":"up";}
    this.moveBox(p,mx*spd*dt,my*spd*dt);
    if(l>.1)p.anim+=dt*8;else p.anim=0;
    if(b.a&&p.atkT<=0)this.attack();
    if(b.b&&p.potT<=0)this.throwPotion();
    for(const e of WORLD.enemies)this.upEnemy(e,dt);
    if(this.boss)this.upBoss(dt);
    // projectiles
    for(let i=this.proj.length-1;i>=0;i--){const pr=this.proj[i];
      pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.life-=dt;
      let hit=false;
      if(pr.ally){

  upEnemy(e,dt){

      if(e.st==="dash"){vx=Math.cos(e.da)*2.4;vy=Math.sin(e.da)*2.4;e.t2+=dt;if(e.t2>.4){e.st="wind";e.t2=0;}}}
    else if(e.ai==="turret"&&aggro){if(e.cd<=0&&d<100){e.cd=2;this.eshoot(e,p,60);}}
    else if(e.ai==="bomber"&&aggro&&d<36){e.dead=true;this.boom({x:e.x,y:e.y,dmg:e.dmg,ally:0,elem:"fire"});this.killReward(e);return;}
    else if(e.ai==="lunge"&&aggro){

    if(r.armor){this.gainGear("armor",r.armor);got.push(ARMORS.find(a=>a.id===r.armor).name);}
    if(r.cloak){this.gainGear("cloak",r.cloak);got.push(CLOAKS.find(c=>c.id===r.cloak).name);}
    if(r.ring){this.gainGear("ring",r.ring);got.push(RINGS.find(x=>x.id===r.ring).name);}
    if(r.weapon){this.data.weapons[r.weapon]=true;got.push(WEAPONS[r.weapon].name);}
    if(r.potion)for(const k in r.potion){this.data.inv[k]=(this.data.inv[k]||0)+r.potion[k];got.push(POTIONS[k].name+" x"+r.potion[k]);}
    Audio.sfx("level");if(got.length){this.msg="Received: "+got.join(", ");this.msgT=3;}},
  say(lines,opts){this.dialog={lines:lines.slice(),i:0,opts:opts||null};},
  updateDialog(b){const dl=this.dialog;
    if(dl.opts){if(b.a){const o=dl.opts[dl.i];this.dialog=null;o.f();}return;}
    if(b.a){Audio.sfx("menu");dl.i++;if(dl.i>=dl.lines.length)this.dialog=null;}}
};

"use strict";
const UI={mode:null,sel:0,shop:null,shopTab:0,craftSel:0,invSel:0,pauseSel:0,titleSel:0,
  togglePause(){Audio.sfx("menu");this.mode=this.mode?null:"pause";this.pauseSel=0;},
  update(b){
    if(b.menu){this.mode=null;return;}
    const n=(d,arr)=>{if(b.b){Audio.sfx("cancel");this.mode=null;return;}
      if(b.up)this.sel=(this.sel-d+arr)%arr;if(b.down)this.sel=(this.sel+d)%arr;};
    // use Input.axes from poll: derive up/down/a handled by caller passing b; axis taps:
    if(this.mode==="pause"){const arr=5;
      if(Input.axes.y<-.5&&!this._uy){this.pauseSel=(this.pauseSel-1+arr)%arr;Audio.sfx("menu");this._uy=1;}
      if(Input.axes.y>.5&&!this._dy){this.pauseSel=(this.pauseSel+1)%arr;Audio.sfx("menu");this._dy=1;}
      if(!Input.axes.y){this._uy=0;this._dy=0;}
      if(b.a){Audio.sfx("confirm");
        if(this.pauseSel===0)this.mode=null;
        else if(this.pauseSel===1){this.mode="inv";this.invSel=0;}
        else if(this.pauseSel===2){this.mode="quest";}
        else if(this.pauseSel===3){this.mode="map";}
        else if(this.pauseSel===4){this.mode=null;UI.titleScene();}}
      return;}
    if(this.mode==="inv"){this.updInv(b);return;}
    if(this.mode==="quest"){if(b.a||b.b){Audio.sfx("cancel");this.mode="pause";}return;}
    if(this.mode==="shop"){this.updShop(b);return;}
    if(this.mode==="craft"){this.updCraft(b);return;}
    if(this.mode==="map"){if(b.a||b.b){Audio.sfx("cancel");this.mode=null;}return;}
  },
  updInv(b){
    const rows=this.invRows();
    if(Input.axes.y<-.5&&!this._uy){this.invSel=(this.invSel-1+rows.length)%rows.length;Audio.sfx("menu");this._uy=1;}
    if(Input.axes.y>.5&&!this._dy){this.invSel=(this.invSel+1)%rows.length;Audio.sfx("menu");this._dy=1;}
    if(!Input.axes.y){this._uy=0;this._dy=0;}
    if(b.b){Audio.sfx("cancel");this.mode="pause";return;}
    if(b.a&&rows[this.invSel])rows[this.invSel].act();},
  invRows(){const d=Game.data,rows=[];
    // weapons
    for(const line of WEAPON_LINES)for(const id of line)if(d.weapons[id])
      rows.push({t:WEAPONS[id].name+(d.weapon===id?" [held]":""),act:()=>{d.weapon=id;Game.recalc();Audio.sfx("confirm");}});
    for(const k in d.inv)if(POTIONS[k]&&d.inv[k]>0)
      rows.push({t:POTIONS[k].name+" x"+d.inv[k],act:()=>{Game.usePotion(k);}});
    if(d.armor)rows.push({t:"Armor: "+ARMORS.find(a=>a.id===d.armor).name,act:()=>{}});
    if(d.cloak)rows.push({t:"Cloak: "+CLOAKS.find(c=>c.id===d.cloak).name,act:()=>{}});
    if(d.ring)rows.push({t:"Ring: "+RINGS.find(r=>r.id===d.ring).name,act:()=>{}});
    for(const k in d.mats)if(d.mats[k]>0)rows.push({t:MAT_NAMES[k]+" x"+d.mats[k],act:()=>{}});
    if(!rows.length)rows.push({t:"(empty)",act:()=>{}});
    return rows;},
  openShop(id){this.mode="shop";this.shop=id;this.shopTab=0;this.sel=0;
    this.rows=this.shop==="bram"?this.bramRows():this.ivyRows();Audio.sfx("confirm");},
  bramRows(){const d=Game.data,rows=[];
    for(const line of WEAPON_LINES){const i=line.indexOf(d.weapon);
      if(i>=0&&i<2){const id=line[i+1];
        rows.push({t:"Upgrade to "+WEAPONS[id].name+" ("+WEAPONS[id].cost+"g)",act:()=>this.buy(id,WEAPONS[id].cost,g=>{g.weapons[id]=true;g.weapon=id;Game.recalc();})});}}
    for(const a of ARMORS)if(!d.armor||ARMORS.findIndex(x=>x.id===d.armor)<ARMORS.findIndex(x=>x.id===a.id))
      if(a.cost>0)rows.push({t:"Armor: "+a.name+" ("+a.cost+"g)",act:()=>this.buy(a.id,a.cost,g=>{g.armor=a.id;Game.recalc();})});
    for(const c of CLOAKS)if(c.cost>0&&(!d.cloak||CLOAKS.findIndex(x=>x.id===d.cloak)<CLOAKS.findIndex(x=>x.id===c.id)))
      rows.push({t:"Cloak: "+c.name+" ("+c.cost+"g)",act:()=>this.buy(c.id,c.cost,g=>{g.cloak=c.id;Game.recalc();})});
    if(!d.ring)rows.push({t:"Ring: "+RINGS[0].name+" ("+RINGS[0].cost+"g)",act:()=>this.buy(RINGS[0].id,RINGS[0].cost,g=>{g.ring=RINGS[0].id;Game.recalc();})});
    if(!rows.length)rows.push({t:"(nothing left to sell you)",act:()=>{}});
    return rows;},
  ivyRows(){const rows=[];
    for(const k in POTIONS)if(POTIONS[k].cost>0)
      rows.push({t:POTIONS[k].name+" ("+POTIONS[k].cost+"g)",act:()=>this.buy(k,POTIONS[k].cost,g=>{g.inv[k]=(g.inv[k]||0)+1;})});
    return rows;},
  buy(id,cost,fn){const d=Game.data;
    if(d.gold<cost){Game.msg="Not enough gold.";Game.msgT=1.5;Audio.sfx("cancel");return;}
    d.gold-=cost;fn(d);Audio.sfx("coin");Game.msg="Bought!";Game.msgT=1.2;Game.save();},
  updShop(b){
    if(Input.axes.y<-.5&&!this._uy){this.sel=Math.max(0,this.sel-1);Audio.sfx("menu");this._uy=1;}
    if(Input.axes.y>.5&&!this._dy){this.sel=Math.min(this.rows.length-1,this.sel+1);Audio.sfx("menu");this._dy=1;}
    if(!Input.axes.y){this._uy=0;this._dy=0;}
    if(b.b){Audio.sfx("cancel");this.mode=null;return;}
    if(b.a&&this.rows[this.sel]){this.rows[this.sel].act();}},
  openCraft(){this.mode="craft";this.craftSel=0;
    this.rows=Object.keys(POTIONS).map(k=>({k,r:POTIONS[k]}));Audio.sfx("confirm");},
  updCraft(b){
    if(Input.axes.y<-.5&&!this._uy){this.craftSel=(this.craftSel-1+this.rows.length)%this.rows.length;Audio.sfx("menu");this._uy=1;}
    if(Input.axes.y>.5&&!this._dy){this.craftSel=(this.craftSel+1)%this.rows.length;Audio.sfx("menu");this._dy=1;}
    if(!Input.axes.y){this._uy=0;this._dy=0;}
    if(b.b){Audio.sfx("cancel");this.mode=null;return;}
    if(b.a){const r=this.rows[this.craftSel],d=Game.data;
      if(!d.recipes.includes(r.k)&&r.k!=="potion_cleanse"&&r.k!=="potion_tide"){Game.msg="Recipe unknown yet.";Game.msgT=1.5;Audio.sfx("cancel");return;}
      for(const m in r.r.recipe)if((d.mats[m]||0)<r.r.recipe[m]){Game.msg="Missing materials.";Game.msgT=1.5;Audio.sfx("cancel");return;}
      for(const m in r.r.recipe)d.mats[m]-=r.r.recipe[m];
      if(!d.recipes.includes(r.k))d.recipes.push(r.k);
      d.inv[r.k]=(d.inv[r.k]||0)+1;Audio.sfx("brew");
      Game.msg="Brewed "+r.r.name+"!";Game.msgT=1.5;Game.save();}},

    ctx.restore();
    // weapon swing arc
    if(p.swing>0){const w=WEAPONS[Game.data.weapon];
      const dx=p.dir==="sideR"?1:p.dir==="sideL"?-1:0,dy=p.dir==="down"?1:p.dir==="up"?-1:0;
      ctx.strokeStyle="#e8ecfc";ctx.lineWidth=2;
      const a0=Math.atan2(dy,dx)-.7,a1=Math.atan2(dy,dx)+.7;
      ctx.beginPath();ctx.arc(p.x,p.y,w.range,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke();ctx.lineWidth=1;}
    // projectiles
    for(const pr of Game.proj){
      ctx.fillStyle=pr.ally?(pr.elem==="fire"?"#ff9a4d":pr.elem==="frost"?"#8fc9ff":pr.elem==="venom"?"#b86bb8":pr.elem==="shock"?"#f2d16b":"#7df0dd"):"#c05a78";
      ctx.fillRect(pr.x-2,pr.y-2,4,4);}
    // drops
    for(const d of Game.drops){
      if(d.gold){ctx.fillStyle="#f2c14e";ctx.fillRect(d.x-2,d.y-2,4,4);}
      else ctx.drawImage(MAT_ICONS[d.item]||MAT_ICONS.herb,d.x-4,d.y-4);}
    FX.render();
    ctx.restore();
    // screen-space HUD
    this.renderHUD();
    if(Game.chapterCard>0){Game.chapterCard-=1/60;
      ctx.fillStyle="rgba(6,4,12,"+Math.min(1,Game.chapterCard)+")";ctx.fillRect(0,0,VW,VH);
      const c=CHAPTERS.find(c=>c.ch===Game.data.chapter);
      if(c){ctx.textAlign="center";ctx.fillStyle="#f2c14e";ctx.font="bold 14px monospace";
        ctx.fillText(c.title,VW/2,VH/2-8);ctx.fillStyle="#cbb6e2";ctx.font="9px monospace";
        ctx.fillText(c.sub,VW/2,VH/2+10);}}
    this.renderDialog();
    FX.renderFade();
  },
  titleScene(){
    const self=this;
    Scenes.switchTo({update(dt){Input.poll();const b=Input.consume();
      if(Input.axes.y<-.5&&!self._ty){self.titleSel=(self.titleSel+2)%3;Audio.sfx("menu");self._ty=1;}
      if(Input.axes.y>.5&&!self._tyy){self.titleSel=(self.titleSel+1)%3;Audio.sfx("menu");self._tyy=1;}
      if(!Input.axes.y){self._ty=0;self._tyy=0;}
      if(b.a){Audio.sfx("confirm");
        if(self.titleSel===0)Game.start(true);
        else if(self.titleSel===1){if(Save.data&&Save.data.playtime>0)Game.start(false);else{Game.msg="No save yet.";Game.msgT=2;}}
        else if(self.titleSel===2){if(Save.data&&Save.data.bossRush)Game.startBossRush();
          else{Game.msg="Beat the story to unlock boss rush.";Game.msgT=2;}}}
      },render(){self.renderTitle();}});},
  renderTitle(){ctx.fillStyle="#2b1b3f";ctx.fillRect(0,0,VW,VH);
    ctx.textAlign="center";
    ctx.fillStyle="#f2c14e";ctx.font="bold 34px monospace";ctx.fillText("TIDEFALL",VW/2,90);
    ctx.fillStyle="#8ff0e8";ctx.font="8px monospace";ctx.fillText("an alchemist's tale of the violet sea",VW/2,104);
    const opts=["New game","Continue","Boss rush"];
    opts.forEach((t,i)=>{ctx.fillStyle=this.titleSel===i?"#f2c14e":"#cbb6e2";ctx.font="10px monospace";
      ctx.fillText((this.titleSel===i?"> ":"")+t,VW/2,140+i*16);});
    ctx.fillStyle="#5a5a7a";ctx.font="7px monospace";
    ctx.fillText("WASD/arrows move  A(Z) attack  B(X) potion/throw  Esc menu",VW/2,250);},
  renderEnding(key){const e=ENDINGS[key];
    ctx.fillStyle="#0b0817";ctx.fillRect(0,0,VW,VH);
    ctx.textAlign="center";ctx.fillStyle="#f2c14e";ctx.font="bold 13px monospace";
    ctx.fillText(e.title,VW/2,50);
    ctx.fillStyle="#cbb6e2";ctx.font="9px monospace";
    e.lines.forEach((l,i)=>ctx.fillText(l,VW/2,80+i*15));
    ctx.fillStyle="#5a5a7a";ctx.font="8px monospace";
    ctx.fillText("[A] back to title",VW/2,VH-20);},
  bossRushStart(){
    const self=this;Game.start(false);Game.data.bossRush=true;
    Game.data.map="ruins";Game.data.px=360;Game.data.py=370;
    Scenes.switchTo(worldScene());
    Game.startBoss("fenmaw");Game.bossDef=null;
    // chain bosses: when one dies, next spawns
    const orig=Game.bossDown.bind(Game);
    Game.bossDown=function(){const done=Game._rush||0;
      const order=["fenmaw","bogmother","stormgolem","skywarden","leviathan","avatar"];
      Game.msg=order[done]+" down!";Game.msgT=2;Game.boss=null;
      if(done>=5){Game.msg="BOSS RUSH COMPLETE!";Game.msgT=4;Game.data.bossRushBest=Date.now();Save.write();Scenes.switchTo({update(){},render:()=>self.renderTitle()});}
      else{Game._rush=done+1;const nx=BOSSES.find(b=>b.id===order[done+1]);
        Game.bossDef=nx;Game.boss={big:1,key:nx.id,x:Game.player.x+40,y:Game.player.y-30,w:28,h:22,
          hp:nx.hp*1.2,maxhp:nx.hp*1.2,dmg:nx.dmg,t:0,cd:1.2,phase:1,flash:0,spd:20,dead:false,vx:0,vy:0};
        Audio.sfx("boss");}};
  }
};
function worldScene(){
  return {update(dt){Game.update(dt);FX.update(dt);},render(){UI.renderWorld();}};
}
function confirmQuitOK(){return true;}

// main.js - boot, game over, wiring
"use strict";
Save.load();
const Boot={t:0,
  update(dt){this.t+=dt;if(this.t>.4)Scenes.switchTo(TITLE_SCENE());},
  render(){ctx.fillStyle="#0b0817";ctx.fillRect(0,0,VW,VH);}};
function TITLE_SCENE(){const s={update(dt){UI.titleSceneUpdate&&null;},render(){UI.renderTitle();}};
  // rewire title logic into scene
  s.update=function(dt){Input.poll();const b=Input.consume();
    if(Input.axes.y<-.5&&!UI._t1){UI.titleSel=(UI.titleSel+2)%3;Audio.sfx("menu");UI._t1=1;}
    if(Input.axes.y>.5&&!UI._t2){UI.titleSel=(UI.titleSel+1)%3;Audio.sfx("menu");UI._t2=1;}
    if(!Input.axes.y){UI._t1=0;UI._t2=0;}
    if(b.a){Audio.sfx("confirm");
      if(UI.titleSel===0){Game.start(true);Scenes.switchTo(worldScene());}
      else if(UI.titleSel===1){
        if(Save.data&&Save.data.playtime>0){Game.start(false);Scenes.switchTo(worldScene());}
        else{Save.data=Save.fresh();Game.start(true);Scenes.switchTo(worldScene());}}
      else if(UI.titleSel===2){Game.startBossRush();}}};
  Audio.play("title");return s;}
Game.startBossRush=function(){
  Game.start(false);Game.data.bossRush=true;Game._rush=0;
  Game.data.map="ruins";Game.data.px=360;Game.data.py=370;
  buildMap("ruins");Game.player.x=360;Game.player.y=370;
  Scenes.switchTo(worldScene());
  const order=["fenmaw","bogmother","stormgolem","skywarden","leviathan","avatar"];
  Game._rushOrder=order;
  const def=BOSSES.find(b=>b.id===order[0]);
  Game.bossDef=def;
  Game.boss={big:1,key:def.id,x:Game.player.x+40,y:Game.player.y-40,w:28,h:22,
    hp:def.hp*1.2,maxhp:def.hp*1.2,dmg:def.dmg,t:0,cd:1.2,phase:1,flash:0,spd:20,dead:false,vx:0,vy:0};
  Game.msg="BOSS RUSH: "+def.name;Game.msgT=2;Audio.sfx("boss");Audio.play("boss");
  Game.bossDown=function(){const i=Game._rush;
    Game.boss=null;
    if(i>=5){Game.msg="BOSS RUSH COMPLETE!";Game.msgT=5;Game.data.bossRushDone=true;Save.write();
      setTimeout(()=>UI.titleScene(),100);}
    else{Game._rush=i+1;const nx=BOSSES.find(b=>b.id===order[i+1]);
      Game.bossDef=nx;Game.boss={big:1,key:nx.id,x:Game.player.x+40,y:Game.player.y-40,w:28,h:22,
        hp:nx.hp*1.2,maxhp:nx.hp*1.2,dmg:nx.dmg,t:0,cd:1.2,phase:1,flash:0,spd:20,dead:false,vx:0,vy:0};
      Game.msg=nx.name+"!";Game.msgT=2;Audio.sfx("boss");}};};
// game over overlay woven into world scene
const _worldUpdate=worldScene;
worldScene=function(){
  const s=_worldUpdate();
  const base=s.update;
  s.update=function(dt){
    const p=Game.player;
    if(p.dead){Input.poll();const b=Input.consume();
      if(b.a){p.dead=false;p.hp=Game.hpMax;
        Game.data.gold=Math.floor(Game.data.gold*.9);
        buildMap("village");p.x=352;p.y=190;Game.data.map="village";Game.save();
        Game.msg="You wake at the village shrine.";Game.msgT=2.5;Audio.play("village");}
      return;}
    base(dt);};
  s.render=function(){UI.renderWorld();
    if(Game.player.dead){
      ctx.fillStyle="rgba(6,4,12,.8)";ctx.fillRect(0,0,VW,VH);
      ctx.textAlign="center";ctx.fillStyle="#e84a5a";ctx.font="bold 16px monospace";
      ctx.fillText("THE TIDE TOOK YOU",VW/2,VH/2-10);
      ctx.fillStyle="#cbb6e2";ctx.font="9px monospace";
      ctx.fillText("[A] wake at the shrine (lose some gold)",VW/2,VH/2+14);}};
  return s;};
// mark maps seen
const _buildMap=buildMap;
buildMap=function(key){_buildMap(key);Game.data.flags["seen_"+key]=true;};
Scenes.push(Boot);

</script>
